# The desktop app (desktop/): its tests on Linux and Windows; Private speech with NVIDIA's real
# runtime and Parakeet on Windows and macOS, hearing speech the system's own voice says; the
# Windows installer: installed, checking itself, then voice typing end to end in the installed app
# (the real Ctrl + Windows shortcut, Parakeet on the computer, the words pasted into another app);
# and the Mac app (one app for Apple silicon and Intel), checking itself.
#
# Signing: with the repository's signing secrets (desktop/README.md › Packaging and signing), the
# Windows installer is signed with Azure Artifact Signing and the Mac app with Apple's Developer ID,
# then notarized. Without them, the builds are unsigned, for testing.
# On main: every build becomes the "Desktop app (test build)" pre-release; signed builds are also
# published as a release (desktop-v<version>), which build-a-bot.site/download offers and the
# installed apps update to.
name: Desktop app

on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  ELECTRON_BUILDER: electron-builder@26.15.3
  # Every build has its own version, so the apps can tell a newer one.
  APP_VERSION: 0.1.${{ github.run_number }}

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test

  private-speech:
    name: Private speech, for real (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Someone talking (the system's own voice)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Speech
          $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $s.GetInstalledVoices() | ForEach-Object { "voice: " + $_.VoiceInfo.Name }
          $fmt = New-Object System.Speech.AudioFormat.SpeechAudioFormatInfo(16000, [System.Speech.AudioFormat.AudioBitsPerSample]::Sixteen, [System.Speech.AudioFormat.AudioChannel]::Mono)
          $s.SetOutputToWaveFile("$env:RUNNER_TEMP\said.wav", $fmt)
          $s.Speak("Let's move the team meeting to next Tuesday at ten in the morning.")
          $s.Dispose()
          Get-Item "$env:RUNNER_TEMP\said.wav" | Select-Object Name, Length
      - name: Someone talking (the system's own voice)
        if: runner.os == 'macOS'
        run: |
          said="Let's move the team meeting to next Tuesday at ten in the morning."
          # On these machines macOS's voice sometimes writes an almost empty file (0.1 s): try again, then other voices.
          for voice in "" "" Samantha Alex Daniel Karen; do
            say ${voice:+-v "$voice"} -o "$RUNNER_TEMP/said.aiff" "$said" || continue
            afconvert -f WAVE -d LEI16@16000 -c 1 "$RUNNER_TEMP/said.aiff" "$RUNNER_TEMP/said.wav" || continue
            size=$(stat -f%z "$RUNNER_TEMP/said.wav")
            echo "voice ${voice:-(default)}: $size bytes"
            # The sentence takes about 4 s; 16 kHz, 16-bit mono is 32,000 bytes a second.
            if [ "$size" -gt 64000 ]; then exit 0; fi
            sleep 2
          done
          echo "::error::macOS's voice didn't say the sentence"
          exit 1
      # Downloads NVIDIA's files the way the app does (about 0.7 GB), checks them, runs the engine.
      # In the user's own folder, as the app keeps it, under a name like a user's (C:\Users\José\…).
      - name: Short names on this drive (Windows)
        if: runner.os == 'Windows'
        run: fsutil 8dot3name query "C:"
      - name: Hear it on this computer
        working-directory: desktop
        run: node scripts/check-private-speech.mjs "$HOME/José Muñoz/private-speech" "${{ runner.temp }}/said.wav" "team meeting, tuesday"

  windows-installer:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      signed: ${{ steps.build.outputs.signed }}
    defaults:
      run:
        working-directory: desktop
    env:
      # Azure Artifact Signing: an app registration allowed to sign with the certificate profile.
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      # The signing account, from the repository's variables (not secret).
      AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
      AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
      AZURE_SIGNING_PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Build it (signed once the signing settings are in)
        id: build
        shell: pwsh
        run: |
          $builderArgs = @("--config", "electron-builder.yml", "--win", "nsis", "--x64", "--publish", "never", "-c.extraMetadata.version=$env:APP_VERSION")
          $keys = @($env:AZURE_TENANT_ID, $env:AZURE_CLIENT_ID, $env:AZURE_CLIENT_SECRET, $env:AZURE_SIGNING_ENDPOINT, $env:AZURE_SIGNING_ACCOUNT, $env:AZURE_SIGNING_PROFILE, $env:AZURE_SIGNING_PUBLISHER)
          # (Counted: PowerShell would read a list of one empty value as "nothing missing".)
          $signed = @($keys | Where-Object { [string]::IsNullOrWhiteSpace($_) }).Count -eq 0
          if ($signed -and $env:GITHUB_EVENT_NAME -eq "pull_request") {
            # Signing only matters for what main publishes.
            $signed = $false
            "::notice::Pull requests build the Windows installer unsigned, for testing; main signs it."
          }
          if ($signed) {
            $builderArgs += @(
              "-c.win.azureSignOptions.endpoint=$env:AZURE_SIGNING_ENDPOINT",
              "-c.win.azureSignOptions.codeSigningAccountName=$env:AZURE_SIGNING_ACCOUNT",
              "-c.win.azureSignOptions.certificateProfileName=$env:AZURE_SIGNING_PROFILE",
              "-c.win.azureSignOptions.publisherName=$env:AZURE_SIGNING_PUBLISHER",
              # Signed release builds update themselves (src/main/updates.mjs).
              "-c.extraMetadata.babUpdates=true"
            )
          } else {
            "::notice::No Windows signing settings yet: this installer is unsigned, for testing (desktop/README.md › Packaging and signing)."
          }
          npx --yes $env:ELECTRON_BUILDER @builderArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "signed=$($signed.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Get-ChildItem dist -File | Select-Object Name, Length
      - name: Check the signature
        if: steps.build.outputs.signed == 'true'
        shell: pwsh
        run: |
          foreach ($f in @(Get-ChildItem dist\*.exe) + @(Get-ChildItem dist\win-unpacked\*.exe)) {
            $sig = Get-AuthenticodeSignature $f.FullName
            "$($f.Name): $($sig.Status) ($($sig.SignerCertificate.Subject))"
            if ($sig.Status -ne "Valid") { throw "$($f.Name) isn't signed properly." }
          }
      # Installed the way an owner does it (for them only, no admin), silently: it goes to
      # %LOCALAPPDATA%\Programs\build-a-bot-desktop.
      - name: Install it, and let the installed app check itself
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\*.exe | Select-Object -First 1
          "installer: $($setup.Name) ($([math]::Round($setup.Length / 1MB)) MB)"
          $inst = Start-Process -FilePath $setup.FullName -ArgumentList "/S" -PassThru
          $inst.WaitForExit()
          "installer exit code: $($inst.ExitCode)"
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Filter "Build-a-bot.exe" -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { throw "It isn't installed." }
          "installed: $exe"
          "BAB_APP_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $env:BAB_SMOKE = "1"
          $env:BAB_SMOKE_OUT = "$env:RUNNER_TEMP\smoke.json"
          $env:BAB_USER_DATA = "$env:RUNNER_TEMP\bab-smoke"
          $p = Start-Process -FilePath $exe -PassThru -Wait
          if (Test-Path $env:BAB_SMOKE_OUT) { Get-Content $env:BAB_SMOKE_OUT } else { "no results" }
          if ($p.ExitCode -ne 0 -or -not (Test-Path $env:BAB_SMOKE_OUT)) {
            if (Test-Path "$env:BAB_USER_DATA\logs\main.log") { Get-Content "$env:BAB_USER_DATA\logs\main.log" -Tail 80 }
            throw "The installed app's self-check failed (exit code $($p.ExitCode))."
          }
      - name: Someone talking (the system's own voice)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Speech
          $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $fmt = New-Object System.Speech.AudioFormat.SpeechAudioFormatInfo(16000, [System.Speech.AudioFormat.AudioBitsPerSample]::Sixteen, [System.Speech.AudioFormat.AudioChannel]::Mono)
          $s.SetOutputToWaveFile("$env:RUNNER_TEMP\said.wav", $fmt)
          $s.Speak("Let's move the team meeting to next Tuesday at ten in the morning.")
          $s.Dispose()
      - name: Voice typing in the installed app, end to end
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          BAB_E2E_SHOTS: ${{ runner.temp }}/shots
        run: |
          npm install --no-save playwright@1.56.1
          $env:BAB_E2E_APP = $env:BAB_APP_EXE
          $env:BAB_E2E_SPEECH_WAV = "$env:RUNNER_TEMP\said.wav"
          node --test --test-timeout=900000 e2e/windows-voice.e2e.mjs
      # Installing a new version over it keeps the owner's data; uninstalling removes the app and
      # its data, even with Private speech's engine left running from that folder (a stand-in: a
      # copy of node.exe named nemo-speech.exe, with the engine's model in its command line).
      - name: An update keeps your data; uninstalling removes everything
        shell: pwsh
        run: |
          $data = Join-Path $env:APPDATA "Build-a-bot"
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          Set-Content -Path (Join-Path $data "keep.txt") -Value "kept"
          $setup = Get-ChildItem dist\*.exe | Select-Object -First 1
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/S" -PassThru -Wait
          "installed over it: exit code $($p.ExitCode)"
          if (-not (Test-Path (Join-Path $data "keep.txt"))) { throw "Installing over it deleted the app's data." }
          if (-not (Test-Path $env:BAB_APP_EXE)) { throw "Installing over it lost the app." }
          $bin = Join-Path $data "speech\runtime\bin"
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          $fake = Join-Path $bin "nemo-speech.exe"
          Copy-Item (Get-Command node).Source $fake
          $engine = Start-Process -FilePath $fake -ArgumentList '-e "setTimeout(() => {}, 600000)" -- serve --asr-model models\parakeet-tdt-0.6b-v3.q8_0.gguf --host 127.0.0.1' -PassThru -WindowStyle Hidden
          Start-Sleep 2
          if ($engine.HasExited) { throw "The stand-in engine didn't start." }
          $un = Get-ChildItem (Split-Path $env:BAB_APP_EXE) -Filter "Uninstall*.exe" | Select-Object -First 1
          "uninstalling: $($un.Name)"
          Start-Process -FilePath $un.FullName -ArgumentList "/S" -Wait
          # The uninstaller hands over to a copy of itself and returns: wait for that to finish.
          for ($i = 0; $i -lt 90 -and ((Test-Path $env:BAB_APP_EXE) -or (Test-Path $data)); $i++) { Start-Sleep 1 }
          if (-not $engine.HasExited) { Stop-Process -Id $engine.Id -Force; throw "Uninstalling left the engine running." }
          if (Test-Path $env:BAB_APP_EXE) { throw "Uninstalling left the app." }
          if (Test-Path $data) { Get-ChildItem -Recurse $data | Select-Object -ExpandProperty FullName; throw "Uninstalling left the app's data." }
          "an update kept the data; uninstalling stopped the engine and removed the app and its data"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-e2e-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: build-a-bot-windows
          # The installer, and what updates read: latest.yml and the block map (for small downloads).
          path: |
            desktop/dist/*.exe
            desktop/dist/*.exe.blockmap
            desktop/dist/latest.yml
          if-no-files-found: error

  mac-app:
    name: Mac app
    needs: test
    runs-on: macos-latest
    timeout-minutes: 60
    outputs:
      signed: ${{ steps.keys.outputs.signed }}
    defaults:
      run:
        working-directory: desktop
    env:
      # Apple's Developer ID certificate (a .p12, base64) and its password, and an App Store Connect
      # API key (the .p8's text, its ID and the issuer ID) for notarizing.
      CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12 }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Signing keys?
        id: keys
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # Signing and notarizing take minutes and only matter for what main publishes.
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pull requests build the Mac app signed ad hoc, for testing; main signs it with the Developer ID."
          elif [ -n "$CSC_LINK" ] && [ -n "$CSC_KEY_PASSWORD" ] && [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Apple signing keys yet: this Mac app is signed ad hoc, for testing (desktop/README.md › Packaging and signing)."
          fi
      # Universal (arm64 + x86_64); electron-builder signs it again with the app's identity.
      - name: The call-detection helper
        run: bash native/macos/build.sh
      - name: Build it (signed and notarized once the keys are in)
        run: |
          args=(--config electron-builder.yml --mac dmg zip --universal --publish never "-c.extraMetadata.version=$APP_VERSION")
          if [ "${{ steps.keys.outputs.signed }}" = "true" ]; then
            # The certificate goes into a keychain of our own, which electron-builder finds and
            # signs with (its own temporary keychain fails to unlock on macOS 26 runners).
            kc="$RUNNER_TEMP/signing.keychain-db"
            kc_pw="$(openssl rand -hex 24)"
            security create-keychain -p "$kc_pw" "$kc"
            security set-keychain-settings -lut 21600 "$kc"
            security unlock-keychain -p "$kc_pw" "$kc"
            printf '%s' "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$kc" -f pkcs12 -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
            rm -f "$RUNNER_TEMP/cert.p12"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pw" "$kc" > /dev/null
            security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
            security find-identity -v -p codesigning "$kc" | grep "Developer ID Application" || { echo "::error::The Developer ID certificate didn't import"; exit 1; }
            unset CSC_LINK CSC_KEY_PASSWORD
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
            # Signed release builds update themselves (src/main/updates.mjs).
            args+=("-c.extraMetadata.babUpdates=true")
          else
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            # electron-builder signs nothing in a pull request unless told to; an ad hoc signature
            # uses no keys, so it's safe there.
            export CSC_FOR_PULL_REQUEST=true
            # Ad hoc: Apple silicon runs nothing unsigned. Without a real identity there's no
            # hardened runtime (it would refuse Electron's libraries) and nothing to notarize.
            args+=("-c.mac.identity=-" "-c.mac.hardenedRuntime=false" "-c.mac.notarize=false")
          fi
          npx --yes "$ELECTRON_BUILDER" "${args[@]}"
          if [ "${{ steps.keys.outputs.signed }}" = "true" ]; then
            # electron-builder notarizes the app; the disk image around it is signed, notarized and
            # stapled too, so a Mac opens the download without asking Apple first.
            id="$(security find-identity -v -p codesigning "$kc" | awk '/Developer ID Application/ { print $2; exit }')"
            for dmg in dist/*.dmg; do
              codesign --sign "$id" --keychain "$kc" --timestamp "$dmg"
              result="$(xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait --output-format json)"
              echo "$result"
              echo "$result" | grep -q '"status":"Accepted"' || { echo "::error::Apple didn't notarize $dmg"; exit 1; }
              xcrun stapler staple "$dmg"
            done
          fi
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          [ -f "$RUNNER_TEMP/signing.keychain-db" ] && security delete-keychain "$RUNNER_TEMP/signing.keychain-db"
          ls -la dist
      - name: Check it
        run: |
          app="$(ls -d dist/mac-universal/*.app | head -1)"
          echo "APP=$PWD/$app" >> "$GITHUB_ENV"
          echo "app: $(lipo -archs "$app/Contents/MacOS/Build-a-bot"); helper: $(lipo -archs "$app/Contents/Resources/bin/bab-audio-helper")"
          for arch in arm64 x86_64; do
            lipo -archs "$app/Contents/MacOS/Build-a-bot" | grep -qw "$arch" || { echo "::error::The app isn't built for $arch"; exit 1; }
          done
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dvv "$app" 2>&1 | grep -E "^(Authority|TeamIdentifier|Signature|Runtime)" || true
          if [ "${{ steps.keys.outputs.signed }}" = "true" ]; then
            # What a Mac says when someone opens the download: notarized, from a known developer.
            spctl --assess --type execute --verbose=4 "$app"
            for dmg in dist/*.dmg; do xcrun stapler validate "$dmg"; done
          fi
      - name: The packaged app checks itself
        run: |
          export BAB_SMOKE=1 BAB_SMOKE_OUT="$RUNNER_TEMP/smoke.json" BAB_USER_DATA="$RUNNER_TEMP/bab-smoke" BAB_ALLOW_PLAINTEXT_TOKEN=1
          set +e
          "$APP/Contents/MacOS/Build-a-bot"
          code=$?
          set -e
          cat "$BAB_SMOKE_OUT" 2>/dev/null || echo "no results"
          if [ $code -ne 0 ] || [ ! -f "$BAB_SMOKE_OUT" ]; then
            tail -80 "$BAB_USER_DATA/logs/main.log" 2>/dev/null || true
            echo "::error::The packaged Mac app's self-check failed (exit code $code)."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: build-a-bot-mac
          # The disk image people download; the .zip, latest-mac.yml and block maps are what updates read.
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.blockmap
            desktop/dist/latest-mac.yml
          if-no-files-found: error

  # On main: every build replaces the "Desktop app (test build)" pre-release; signed builds also
  # become a release, which build-a-bot.site/download offers and the installed apps update to.
  publish:
    name: Publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows-installer, mac-app, private-speech]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      WIN_SIGNED: ${{ needs.windows-installer.outputs.signed }}
      MAC_SIGNED: ${{ needs.mac-app.outputs.signed }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-a-bot-windows
          path: dist/windows
      - uses: actions/download-artifact@v4
        with:
          name: build-a-bot-mac
          path: dist/mac
      - name: Replace the test build
        run: |
          gh release delete desktop-test --yes --cleanup-tag || true
          {
            echo "The desktop app, built from main by GitHub Actions after it checked itself on a real Mac and installed itself and typed a sentence on a real Windows computer."
            echo
            if [ "$WIN_SIGNED" = "true" ]; then
              echo "- **Windows 10 and 11:** \`Build-a-bot-Setup-$APP_VERSION.exe\`, signed. It installs for you only (no admin needed) and starts right away."
            else
              echo "- **Windows 10 and 11:** \`Build-a-bot-Setup-$APP_VERSION.exe\`, not signed yet. Your browser may ask you to **Keep** it, Windows says *Windows protected your PC* (**More info** → **Run anyway**), and Smart App Control blocks it outright."
            fi
            if [ "$MAC_SIGNED" = "true" ]; then
              echo "- **Mac (Apple silicon and Intel, macOS 13 or later):** \`Build-a-bot-$APP_VERSION-mac-universal.dmg\`, signed and notarized. Open it and double-click Build-a-bot: it moves itself into Applications."
            else
              echo "- **Mac (Apple silicon and Intel, macOS 13 or later):** \`Build-a-bot-$APP_VERSION-mac-universal.dmg\`, not signed yet, for testing: macOS won't open it until you allow it in **System Settings → Privacy & Security → Open Anyway**."
            fi
            echo
            echo "Pair it with a code from build-a-bot.site (**Bridge (your computer)**), then **Set up voice typing**: NVIDIA Parakeet downloads (about 0.7 GB) and hears you on the computer. A newer test build installs over this one and keeps your pairing, settings and Parakeet. See desktop/README.md for everything it does."
          } > notes.md
          gh release create desktop-test dist/windows/*.exe dist/mac/*.dmg --prerelease --target "$GITHUB_SHA" \
            --title "Desktop app (test build, $APP_VERSION)" --notes-file notes.md
      - name: Publish the signed release
        if: env.WIN_SIGNED == 'true' || env.MAC_SIGNED == 'true'
        run: |
          files=()
          if [ "$WIN_SIGNED" = "true" ]; then files+=(dist/windows/*.exe dist/windows/*.blockmap dist/windows/latest.yml); fi
          if [ "$MAC_SIGNED" = "true" ]; then files+=(dist/mac/*.dmg dist/mac/*.zip dist/mac/*.blockmap dist/mac/latest-mac.yml); fi
          {
            echo "Build-a-bot for your computer: meeting notes and voice typing, heard on the computer by NVIDIA Parakeet."
            echo
            echo "Get it from https://build-a-bot.site/download. Installed apps update to this version by themselves."
          } > release.md
          gh release create "desktop-v$APP_VERSION" "${files[@]}" --target "$GITHUB_SHA" \
            --title "Build-a-bot desktop $APP_VERSION" --notes-file release.md
