# A real call on the live site (scripts/live-call.mjs): a browser presses a new bot's Call button
# and asks a question out loud; on the voice server NVIDIA Parakeet hears it, Nemotron answers and
# Magpie speaks. Runs after each deploy of the voice server (voice.yml) and of the site (Vercel
# reports its deploys to GitHub), and by hand: Actions → Live call → Run workflow. The run's summary
# has what was said and how long the answer took; the screenshots and every call event are in its
# artifact.
name: Live call

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: The site to call through (default the APP_URL variable, else https://build-a-bot.site)
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      app_url:
        type: string
        required: false
        default: ""
  deployment_status:

permissions:
  contents: read

jobs:
  call:
    # From Vercel, only a production deploy that finished (its environment reads "Production",
    # or "Production – build-a-bot").
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && startsWith(github.event.deployment.environment, 'Production'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The voice server takes one call at a time: one check at a time.
    concurrency:
      group: live-call
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Call
        env:
          APP_URL: ${{ inputs.app_url || vars.APP_URL || 'https://build-a-bot.site' }}
          # Calls need a signed-in account: the check signs in as its own with the voice server's secret.
          VOICE_SERVER_SECRET: ${{ secrets.VOICE_SERVER_SECRET }}
        run: node scripts/live-call.mjs "$APP_URL" live-call
      - name: Screenshots and events
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-call
          path: live-call/
          if-no-files-found: ignore
