# The speech server (speech/): its tests on every change, and its images on main.
# Images: ghcr.io/<owner>/build-a-bot-speech:cpu and :cuda (plus :cpu-<sha> / :cuda-<sha>).
name: Speech server

on:
  push:
    branches: [main]
    paths: ["speech/**", ".github/workflows/speech-image.yml"]
  pull_request:
    paths: ["speech/**", ".github/workflows/speech-image.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Test
        working-directory: speech
        run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        backend: [cpu, cuda]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # The CPU image runs here before it's published: both models load, and a real recording
      # (a LibriSpeech sample) comes back as the right words. The GPU image needs a GPU to run.
      - name: Build the CPU image to try it
        if: matrix.backend == 'cpu'
        uses: docker/build-push-action@v6
        with:
          context: speech
          build-args: BACKEND=cpu
          load: true
          tags: build-a-bot-speech:try
          cache-from: type=gha,scope=speech-cpu
          cache-to: type=gha,mode=max,scope=speech-cpu
      - name: Try it on a real recording
        if: matrix.backend == 'cpu'
        run: |
          docker run -d --name speech -p 8000:8000 -e SPEECH_API_KEY=ci-key build-a-bot-speech:try
          for i in $(seq 1 90); do curl -sf http://localhost:8000/health > /dev/null && break; sleep 2; done
          curl -sf http://localhost:8000/health && echo
          curl -sfL -o sample.flac https://cdn-media.huggingface.co/speech_samples/sample1.flac
          out=$(curl -sf -H "Authorization: Bearer ci-key" -F file=@sample.flac -F response_format=verbose_json http://localhost:8000/v1/audio/transcriptions)
          echo "$out" | head -c 800 && echo
          echo "$out" | grep -qi "country roads"
          test "$(curl -s -o /dev/null -w '%{http_code}' -F file=@sample.flac http://localhost:8000/v1/audio/transcriptions)" = 401
      - name: The container's log
        if: always() && matrix.backend == 'cpu'
        run: docker logs speech 2>&1 | tail -40 || true
      - name: Sign in to GitHub's container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build${{ github.event_name != 'pull_request' && ' and publish' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: speech
          build-args: BACKEND=${{ matrix.backend }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/build-a-bot-speech:${{ matrix.backend }}
            ghcr.io/${{ github.repository_owner }}/build-a-bot-speech:${{ matrix.backend }}-${{ github.sha }}
          cache-from: type=gha,scope=speech-${{ matrix.backend }}
          cache-to: type=gha,mode=max,scope=speech-${{ matrix.backend }}
