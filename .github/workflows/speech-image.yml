# The speech server (speech/): its tests on every change, and its images on main.
# Images: ghcr.io/<owner>/build-a-bot-speech:cpu and :cuda (plus :cpu-<sha> / :cuda-<sha>).
name: Speech server

on:
  push:
    branches: [main]
    paths: ["speech/**", ".github/workflows/speech-image.yml"]
  pull_request:
    paths: ["speech/**", ".github/workflows/speech-image.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Test
        working-directory: speech
        run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        backend: [cpu, cuda]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to GitHub's container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build${{ github.event_name != 'pull_request' && ' and publish' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: speech
          build-args: BACKEND=${{ matrix.backend }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/build-a-bot-speech:${{ matrix.backend }}
            ghcr.io/${{ github.repository_owner }}/build-a-bot-speech:${{ matrix.backend }}-${{ github.sha }}
          cache-from: type=gha,scope=speech-${{ matrix.backend }}
          cache-to: type=gha,mode=max,scope=speech-${{ matrix.backend }}
