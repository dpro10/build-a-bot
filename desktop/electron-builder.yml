# Packaging: CI builds, signs and publishes the Mac and Windows apps (.github/workflows/desktop.yml);
# `npm run dist` builds one by hand on its own OS. See README › Packaging and signing.
appId: site.build-a-bot.desktop
productName: Build-a-bot
copyright: Copyright © 2026 Build-a-bot
directories:
  output: dist
  buildResources: build
files:
  - package.json
  - src/**/*
  - assets/**/*
  - "!**/*.map"
asar: true
# Voice typing's keyboard hook is native code (N-API, prebuilt for every platform): it must sit
# outside the asar archive, and it needs no rebuild for Electron.
asarUnpack:
  - node_modules/uiohook-napi/**
npmRebuild: false
# Updates (signed release builds only; src/main/updates.mjs): the app asks build-a-bot.site, which
# sends it on to the latest release's files, so where they live can change without a new app.
publish:
  provider: generic
  url: https://build-a-bot.site/desktop/updates

mac:
  category: public.app-category.productivity
  # One app for Apple silicon and Intel Macs (CI builds it with --universal): nothing to choose.
  # The .zip is what updates download.
  target: [dmg, zip]
  artifactName: "Build-a-bot-${version}-mac-${arch}.${ext}"
  # Universal build: these are the same file in the Apple silicon and Intel halves (the keyboard
  # hook ships one prebuilt file per chip and loads the right one; the helper is already built for
  # both), so they're kept as they are instead of being merged.
  x64ArchFiles: "{Contents/Resources/app.asar.unpacked/node_modules/uiohook-napi/prebuilds/**,Contents/Resources/bin/bab-audio-helper}"
  icon: build/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarizes with APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER (or APPLE_ID +
  # APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID) from the environment.
  notarize: true
  extendInfo:
    # A menu-bar app: no Dock icon.
    LSUIElement: true
    NSMicrophoneUsageDescription: "Build-a-bot uses your microphone only after you say yes to taking notes, or while you hold the voice typing shortcut, and only while it shows on your screen."
    NSAudioCaptureUsageDescription: "Your bot hears the call's audio (the other people) only after you say yes to taking notes, so the notes include everyone."
    NSAppleEventsUsageDescription: "Only if you turn it on: Build-a-bot reads your browser tabs' addresses to recognize Google Meet and Teams calls. It never reads what's on the page."
  # The Swift helper (bash native/macos/build.sh) for per-app call detection.
  extraResources:
    - from: native/macos/build/bab-audio-helper
      to: bin/bab-audio-helper

win:
  target: [nsis]
  icon: build/icon.png
  # Signed in CI with Azure Artifact Signing (azureSignOptions, from the repository's settings), or
  # a certificate (WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD). Unsigned builds trigger SmartScreen.

nsis:
  # One click: no questions, no admin, and it opens when it's done.
  oneClick: true
  artifactName: "Build-a-bot-Setup-${version}.${ext}"
  perMachine: false
  allowElevation: false
  # Uninstalling deletes what the app keeps on this computer (its settings, the voice typing
  # history, NVIDIA Parakeet's 0.7 GB); installing a new version over it keeps all that.
  # build/installer.nsh stops Private speech's engine first.
  deleteAppDataOnUninstall: true

linux:
  target: [AppImage, deb]
  icon: build/icon.png
  category: Office
  synopsis: Your bot notices calls and asks before it takes notes
  maintainer: Build-a-bot <hello@build-a-bot.site>
deb:
  depends: [pulseaudio-utils | pipewire-pulse]
